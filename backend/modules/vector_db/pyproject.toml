[project]
name = "vector-db"
version = "0.1.0"
description = "Reusable vector database module for PersonalAI"
authors = [{ name = "PersonalAI Team" }]
requires-python = ">=3.12,<3.13"
dependencies = [
	"chromadb",
	"pydantic",
	"core",
]

[project.scripts]
vector-db = "vector_db:main"

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
