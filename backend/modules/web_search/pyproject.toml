[project]
name = "web-search"
version = "0.1.0"
description = "Reusable web search module for PersonalAI"
authors = [{ name = "PersonalAI Team" }]
requires-python = ">=3.12,<3.13"
dependencies = [
	"beautifulsoup4~=4.12.2",
	"ddgs==9.11.4",
]

[project.scripts]
web-search = "web_search:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
