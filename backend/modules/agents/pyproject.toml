[project]
name = "agents"
version = "0.1.0"
description = "LangGraph agent orchestration module for PersonalAI"
authors = [{ name = "PersonalAI Team" }]
requires-python = ">=3.12,<3.13"
dependencies = [
	"langchain~=1.0.0",
	"langchain-core~=1.0.0",
	"langgraph~=1.0.0",
	"langgraph-checkpoint-sqlite==3.0.0",
	"aiosqlite==0.20.0",
	"pydantic",
	"core",
	"vector-db",
	"web-search",
	"llm-module",
]

[project.scripts]
agents = "agents:main"

[tool.uv.sources]
core = { workspace = true }
vector-db = { workspace = true }
web-search = { workspace = true }
llm-module = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
