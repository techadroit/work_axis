[project]
name = "core"
version = "0.1.0"
description = "Shared core utilities for WorkAxis workspace"
authors = [{ name = "WorkAxis Team" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru~=0.7.3",
    "pydantic",
]

[project.scripts]
core = "core:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
