[project]
name = "llm-module"
version = "0.1.0"
description = "Reusable LLM configuration, providers and handler module for WorkAxis"
authors = [{ name = "WorkAxis Team" }]
requires-python = ">=3.12,<3.13"
dependencies = [
	"langchain~=1.0.0",
	"langchain-core~=1.0.0",
	"langchain-aws~=1.0.0",
	"langchain-openai~=1.0.0",
	"langchain-anthropic~=1.0.0",
	"langchain-ollama~=1.0.0",
	"langchain_google_genai~=3.0.0",
	"langgraph-checkpoint-sqlite==3.0.0",
	"aiosqlite==0.20.0",
	"sentence-transformers",
	"huggingface_hub",
	"pydantic",
	"core",
]

[project.scripts]
llm-module = "llm_module:main"

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
